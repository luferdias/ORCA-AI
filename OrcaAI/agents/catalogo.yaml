workflows:
  - comando: novo-orcamento
    argumento: "<slug>"
    plataforma: claude_code
    aciona: [A1, A3]
    descricao: "Abre um item de orçamento e conduz triagem, planejamento e extração inicial de escopo."
    fluxo:
      - "Acionar A1 para a triagem e as perguntas mínimas."
      - "Criar a pasta com tools/cli/criar_projeto.py <slug> e preencher projeto.md."
      - "Acionar A1 para plano-execucao.md: objetivo, escopo, entradas, agentes, skills, tarefas, critérios e pausas."
      - "Acionar A3 para extrair escopo e quantitativos iniciais."
    saida: ["pasta do item", "projeto.md", "plano-execucao.md", "pendências iniciais"]
  - comando: observar-orcafascio
    plataforma: antigravity
    aciona: [A10]
    descricao: "Grava uma sessão do engenheiro no Orçafascio como trilha de demonstração."
    fluxo:
      - "Abrir o Orçafascio e aguardar o login manual."
      - "Acionar A10 em modo observador; registrar cada ação em knowledge/demonstracoes/<item>/<data>-orcafascio.jsonl."
      - "Ao final, resumir os padrões observados para o A3."
    saida: ["trilha de demonstração", "resumo para síntese de padrões"]
  - comando: orcafascio
    plataforma: antigravity
    aciona: [A10, A4]
    descricao: "Opera o Orçafascio em modo autônomo supervisionado, com trava anti-alucinação."
    fluxo:
      - "Ler projeto.md e os padrões validados em knowledge/padroes/."
      - "Abrir o Orçafascio e aguardar o login manual do engenheiro."
      - "Confirmar o De acordo em log-decisoes.md antes de qualquer inserção."
      - "Para cada item: buscar, submeter o código ao A4, gravar só com aprovação; sem item exato, suspender e acionar A1."
      - "Exportar para bases/orcafascio-export/ e registrar base, UF, data-base e arquivo."
    saida: ["itens inseridos", "exportação", "evidências"]
    regras: ["Não armazenar, solicitar ou digitar senha.", "Não criar composição própria sem aprovação humana."]
  - comando: pesquisar-precos
    plataforma: antigravity
    aciona: [A11, coletor-cotacoes]
    descricao: "Pesquisa de mercado para itens sem base oficial, com três cotações e aprovação humana."
    fluxo:
      - "Acionar A11 na cascata Vitória, RJ, SP e BH."
      - "Acionar coletor-cotacoes para organizar propostas e evidências."
      - "Gerar 04-cotacoes/relatorio-cotacoes.md com mediana e descartes motivados."
      - "Pausar para aprovação e registrar em log-decisoes.md."
    saida: ["tabela de cotações", "critério de preço adotado", "pendência ou aprovação"]
  - comando: atualizar-bases
    plataforma: antigravity
    aciona: [A11, A9]
    descricao: "Baixa a edição vigente das tabelas oficiais e reconstrói o índice local."
    fluxo:
      - "Acionar A11 para consultar cada portal do catálogo pela regra da última tabela."
      - "Guardar o ZIP original em bases/<fonte>/<competencia>/originais/ com manifesto (URL, publicação, tamanho, SHA-256)."
      - "Acionar A9 para ingerir e reconstruir knowledge/indices/ com manifesto."
      - "Atualizar bases/catalogo_fontes_referenciais.json."
    saida: ["ZIP original", "manifesto", "índice"]
  - comando: validar-orcamento
    plataforma: claude_code
    aciona: [A4, validador-codigos]
    descricao: "Valida planilha, códigos, fontes, BDI, curva ABC e riscos antes dos documentos finais."
    fluxo:
      - "Acionar validador-codigos (validate_codes.py) contra as bases locais."
      - "Acionar A4 para G-01 a G-10, curva ABC, auditoria de fontes e matriz de riscos."
      - "Gerar relatórios em 05-validacoes/."
    saida: ["validacao-codigos.md", "relatorio-guardrails.md", "curva-abc.md", "lista de bloqueios"]
  - comando: gerar-documentos
    plataforma: codex
    aciona: [A6, renderizador-documentos]
    descricao: "Gera especificação, memorial, TR, demonstrativo de BDI e relatórios a partir da planilha validada."
    fluxo:
      - "Confirmar que /validar-orcamento foi executado sem bloqueios."
      - "Acionar A6 com os templates de OrcaAI/templates/."
      - "Acionar renderizador-documentos para DOCX e PDF em 06-documentos/."
    saida: ["especificação técnica", "memorial ou TR", "demonstrativo de BDI", "relatório de cotações quando houver"]
  - comando: instruir-sei
    plataforma: claude_code
    aciona: [A5]
    descricao: "Peças de instrução processual: despachos, notas técnicas, TJTR e DFD."
    fluxo:
      - "Ler o dossiê aprovado e os pareceres recebidos em _governanca_sei_agu_cgu."
      - "Acionar A5 para redigir as peças com a fundamentação legal expressa."
      - "Salvar em 06-documentos/sei/ e arquivar cópia na governança."
    saida: ["despachos", "notas técnicas", "TJTR", "DFD"]
  - comando: gerar-dossie
    plataforma: claude_code
    aciona: [A1, A4]
    descricao: "Monta o pacote final com índice, checklist, planilha, memória, validações, documentos e pendências."
    fluxo:
      - "Acionar A4 para a revisão final."
      - "Aplicar dossie-licitacao-publica; gerar indice-dossie.md com tools/cli/gerar_indice_dossie.py."
      - "Acionar A1 para listar finais e pendências."
    saida: ["indice-dossie.md", "checklist-final.md", "lista de documentos finais"]
  - comando: revisar-final
    plataforma: claude_code
    aciona: [A4]
    descricao: "Revisão final de coerência entre escopo, orçamento, memória, documentos e dossiê."
    fluxo:
      - "Acionar A4 para o checklist de revisão final."
      - "Conferir bloqueios pendentes; gerar checklist-final.md."
      - "Pausar para aprovação humana."
    saida: ["status aprovado, aprovado com ressalvas ou bloqueado"]
  - comando: status-orca
    plataforma: qualquer
    aciona: []
    descricao: "Mostra a fase atual de um item, pendências e próximo comando."
    fluxo:
      - "Ler projeto.md, plano-execucao.md, log-decisoes.md e as oito pastas de etapa."
    saida: ["resumo com fase atual, pendências e próximo comando sugerido"]
  - comando: auditar-5s
    plataforma: claude_code
    aciona: [A2]
    descricao: "Relatório de conformidade 5S do repositório."
    fluxo:
      - "Acionar A2: Seiri, Seiton, Seiso, Seiketsu e Shitsuke."
      - "Rodar tools/cli/validar_estrutura.py, ruff e testes; regenerar projeções e conferir diff vazio."
    saida: ["relatório de conformidade 5S"]
  - comando: experimento-ml
    plataforma: claude_code
    aciona: [A12]
    descricao: "Executa um experimento da extensão ML/UFG com manifesto e relatório."
    fluxo:
      - "Acionar A12; executar em OrcaAI/ufg/ml com saída em pasta nova."
      - "Registrar manifesto; submeter a SA-ML-05 e A4."
    saida: ["execução com manifesto", "relatório"]
