   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #163047" transform="translate(53.856 292.738238)">quadrado, em (R$/unidade)². Esses valores são apresentados por grupo nativo e unidade, sem somar moedas de unidades diferentes.</text>
