  <g id="text_8">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1765ad" x="53.856" y="343.802456" transform="rotate(-0 53.856 343.802456)">R² e viés</text>
  </g>
  <g id="text_9">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #163047" transform="translate(53.856 370.47045)">R² compara o erro quadrático com a dispersão dos valores observados; pode ser negativo e fica indefinido quando o observado é</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #163047" transform="translate(53.856 388.47045)">constante. R² alto não garante ganho sobre persistência. Viés percentual é a média de 100 × (previsto - observado) / observado:</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #163047" transform="translate(53.856 406.47045)">positivo indica superestimação média.</text>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1765ad" x="53.856" y="456.796856" transform="rotate(-0 53.856 456.796856)">Como os modelos foram escolhidos?</text>
  </g>
  <g id="text_11">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #163047" transform="translate(53.856 484.06485)">O MSE da validação escolhe regressão simples ou múltipla por grupo nativo e unidade. O modelo é reajustado antes do teste e</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #163047" transform="translate(53.856 502.06485)">avaliado mês a mês. A apresentação em MAPE não muda essa escolha nem elimina resultados desfavoráveis.</text>
  </g>
  <g id="text_12">
   <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526677" x="44.064" y="640.605844" transform="rotate(-0 44.064 640.605844)">Referência: scikit-learn.org/stable/modules/model_evaluation.html · Registros e critérios no manifesto do relatório</text>
  </g>
  <g id="text_13">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526677" x="936.1152" y="656.208" transform="rotate(-0 936.1152 656.208)">27</text>
  </g>
